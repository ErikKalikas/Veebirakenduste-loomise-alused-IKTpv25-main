<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>

<body>

<h1>iseseisevtabelid</h1>

<table id="IsTabel">
    <!-- 1. rida -->
    <tr>
        <td colspan="6">1</td>
        <td colspan="4">+</td>
    </tr>
    <!-- 2. rida -->
    <tr>
        <td rowspan="5">3</td>
        <td rowspan="5">4</td>
        <td rowspan="5">5</td>
        <td colspan="7">2</td>
    </tr>
    <!-- 3. rida -->
    <tr>
        <td colspan="7">6</td>
    </tr>
    <!-- 4. rida -->
    <tr>
        <td rowspan="3">8</td>
        <td rowspan="3">7</td>
        <td rowspan="3">9</td>
        <td colspan="4">10</td>
    </tr>
    <!-- 5. rida -->
    <tr>
        <td colspan="4">11</td>
    </tr>
    <!-- 6. rida -->
    <tr>
        <td colspan="3"></td>
        <td>12</td>
    </tr>

</table>

</body>
</html>
