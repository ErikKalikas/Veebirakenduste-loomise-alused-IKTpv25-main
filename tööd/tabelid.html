<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>tabelid</h1>
<h2>Lihtne tabel</h2>
<table id = "lihtne">
    <tr>
        <td class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<*test*>
<h1>tabelid</
<h1>
<h2>Tabel kus on ühendatud lahtrid</h2>
<table>
    <tr>
        <td colspan="2" class="nimia">A</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtri</h2>

<table id = "keeruline2">
    <tr>
        <td rowspan="2" class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>

</body>
</html>
